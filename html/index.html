    // --- TAB: ADMIN CALENDAR ---
    function AdminCalendarTab({ bookings, setBookings, showToast }) {
      const [currentMonth, setCurrentMonth] = useState(new Date(2025, 4, 1)); // May 2025
      const [selectedEvent, setSelectedEvent] = useState(null);
      const [showNewEventModal, setShowNewEventModal] = useState(false);

      // Month Navigation
      const nextMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1));
      const prevMonth = () => setCurrentMonth(new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1));

      const monthName = currentMonth.toLocaleString('fr-FR', { month: 'long', year: 'numeric' });

      // Generate Calendar Days for Current Month
      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Monday start

      const days = [];
      for (let i = 0; i < firstDayIndex; i++) days.push(null);
      for (let d = 1; d <= daysInMonth; d++) days.push(d);

      return (
        <div className="bg-white rounded-2xl border border-stone-200 p-6 shadow-sm space-y-6">
          {/* Header & Controls */}
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="font-serif text-2xl font-bold text-charcoal capitalize">{monthName}</h2>
              <p className="text-xs text-stone-500">Visualisez les mariages, banquets et éventuels conflits de dates</p>
            </div>

            <div className="flex items-center space-x-3 rtl:space-x-reverse">
              <div className="flex items-center space-x-1 border border-stone-200 rounded-xl p-1 bg-stone-50">
                <button onClick={prevMonth} className="p-1.5 rounded-lg hover:bg-white text-stone-600 transition">
                  <i data-lucide="chevron-left" className="w-4 h-4"></i>
                </button>
                <button onClick={nextMonth} className="p-1.5 rounded-lg hover:bg-white text-stone-600 transition">
                  <i data-lucide="chevron-right" className="w-4 h-4"></i>
                </button>
              </div>

              <button
                onClick={() => setShowNewEventModal(true)}
                className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2"
              >
                <i data-lucide="plus" className="w-4 h-4"></i>
                <span>Ajouter un Événement</span>
              </button>
            </div>
          </div>

          {/* Calendar Grid */}
          <div className="border border-stone-200 rounded-xl overflow-hidden">
            <div className="grid grid-cols-7 bg-stone-100 text-stone-600 text-center text-xs font-bold py-2.5 border-b border-stone-200">
              {['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map((d, i) => (
                <div key={i}>{d}</div>
              ))}
            </div>

            <div className="grid grid-cols-7 auto-rows-[110px] divide-x divide-y divide-stone-100 text-xs">
              {days.map((day, idx) => {
                if (!day) return <div key={idx} className="bg-stone-50/40 p-2"></div>;

                const dayString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const eventsOnThisDay = bookings.filter(b => b.date === dayString);
                const hasConflict = eventsOnThisDay.length > 1;

                return (
                  <div key={idx} className={`p-2 transition relative flex flex-col justify-between ${hasConflict ? 'bg-coral-50/50' : 'hover:bg-amber-50/30'}`}>
                    <div className="flex justify-between items-center">
                      <span className={`font-bold text-xs ${eventsOnThisDay.length > 0 ? 'text-amber-800 font-black' : 'text-stone-700'}`}>
                        {day}
                      </span>
                      {hasConflict && (
                        <span className="text-[9px] bg-coral-600 text-white font-black px-1.5 py-0.5 rounded-full" title="Double réservation">
                          Conflit
                        </span>
                      )}
                    </div>

                    <div className="space-y-1 overflow-y-auto max-h-[70px]">
                      {eventsOnThisDay.map(ev => (
                        <div
                          key={ev.id}
                          onClick={() => setSelectedEvent(ev)}
                          className={`p-1 rounded text-[10px] font-semibold cursor-pointer truncate transition ${
                            ev.status === 'Confirmé' ? 'bg-emerald-100 text-emerald-800 hover:bg-emerald-200' :
                            ev.status === 'En préparation' ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' :
                            'bg-stone-200 text-stone-800 hover:bg-stone-300'
                          }`}
                        >
                          {ev.clientName} ({ev.eventType})
                        </div>
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* EVENT DETAIL MODAL */}
          {selectedEvent && (
            <div className="fixed inset-0 z-50 bg-charcoal/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-amber-300 space-y-4">
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-black uppercase tracking-wider text-amber-800 bg-amber-100 px-2.5 py-1 rounded-full">
                      {selectedEvent.eventType}
                    </span>
                    <h3 className="font-serif font-bold text-2xl text-charcoal mt-1">{selectedEvent.clientName}</h3>
                  </div>
                  <button onClick={() => setSelectedEvent(null)} className="p-1 rounded-full hover:bg-stone-100 text-stone-500">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="grid grid-cols-2 gap-3 text-xs bg-stone-50 p-4 rounded-xl">
                  <div>
                    <span className="text-stone-400 block font-semibold">Date & Heure :</span>
                    <span className="font-bold text-stone-800">{selectedEvent.date} à {selectedEvent.time}</span>
                  </div>
                  <div>
                    <span className="text-stone-400 block font-semibold">Lieu :</span>
                    <span className="font-bold text-stone-800">{selectedEvent.location}</span>
                  </div>
                  <div>
                    <span className="text-stone-400 block font-semibold">Convives :</span>
                    <span className="font-bold text-stone-800">{selectedEvent.guests} personnes</span>
                  </div>
                  <div>
                    <span className="text-stone-400 block font-semibold">Budget Estimatif :</span>
                    <span className="font-bold text-amber-800 text-sm">{Number(selectedEvent.estimatedBudget).toLocaleString()} TND</span>
                  </div>
                </div>

                <div>
                  <h4 className="text-xs font-bold text-stone-700 uppercase mb-1">Statut Actuel :</h4>
                  <select
                    value={selectedEvent.status}
                    onChange={(e) => {
                      const updated = bookings.map(b => b.id === selectedEvent.id ? { ...b, status: e.target.value } : b);
                      setBookings(updated);
                      setSelectedEvent({ ...selectedEvent, status: e.target.value });
                      showToast('Statut mis à jour avec succès');
                    }}
                    className="w-full px-3 py-2 text-xs rounded-xl border border-stone-300 font-semibold bg-white"
                  >
                    {['Nouvelle demande', 'En attente', 'Devis envoyé', 'Confirmé', 'En préparation', 'Terminé', 'Annulé'].map(st => (
                      <option key={st} value={st}>{st}</option>
                    ))}
                  </select>
                </div>

                <div className="text-xs text-stone-600 bg-amber-50/60 p-3 rounded-xl border border-amber-200/50">
                  <span className="font-bold block text-amber-900 mb-1">Notes Internes Cuisine :</span>
                  {selectedEvent.notes || 'Aucune note particulière.'}
                </div>

                <div className="flex justify-between items-center pt-2">
                  <button
                    onClick={() => {
                      if (confirm('Voulez-vous supprimer cette réservation ?')) {
                        setBookings(bookings.filter(b => b.id !== selectedEvent.id));
                        setSelectedEvent(null);
                        showToast('Réservation supprimée');
                      }
                    }}
                    className="text-xs text-coral-600 hover:underline font-bold"
                  >
                    Supprimer l’événement
                  </button>
                  <button
                    onClick={() => setSelectedEvent(null)}
                    className="bg-charcoal text-white px-5 py-2 rounded-xl text-xs font-bold"
                  >
                    Fermer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* NEW EVENT QUICK MODAL */}
          {showNewEventModal && (
            <NewBookingModal
              onClose={() => setShowNewEventModal(false)}
              onSave={(newEvent) => {
                setBookings([newEvent, ...bookings]);
                setShowNewEventModal(false);
                showToast('Événement ajouté au calendrier');
              }}
            />
          )}
        </div>
      );
    }

    // --- TAB: ADMIN BOOKINGS LIST ---
    function AdminBookingsTab({ bookings, setBookings, showToast }) {
      const [filterStatus, setFilterStatus] = useState('All');
      const [searchTerm, setSearchTerm] = useState('');

      const filtered = useMemo(() => {
        return bookings.filter(b => {
          const matchStatus = filterStatus === 'All' || b.status === filterStatus;
          const matchSearch = b.clientName.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              b.eventType.toLowerCase().includes(searchTerm.toLowerCase()) ||
                              b.location.toLowerCase().includes(searchTerm.toLowerCase());
          return matchStatus && matchSearch;
        });
      }, [bookings, filterStatus, searchTerm]);

      const handleStatusChange = (id, newStatus) => {
        const updated = bookings.map(b => b.id === id ? { ...b, status: newStatus } : b);
        setBookings(updated);
        showToast(`Statut de réservation changé à : ${newStatus}`);
      };

      const handleDelete = (id) => {
        if (confirm('Supprimer définitivement cette réservation ?')) {
          setBookings(bookings.filter(b => b.id !== id));
          showToast('Réservation effacée');
        }
      };

      return (
        <div className="bg-white rounded-2xl border border-stone-200 p-6 shadow-sm space-y-6">
          {/* Filter Bar */}
          <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
            <div className="relative w-full sm:w-72">
              <i data-lucide="search" className="w-4 h-4 text-stone-400 absolute left-3 top-3"></i>
              <input
                type="text"
                placeholder="Rechercher client, événement..."
                value={searchTerm}
                onChange={e => setSearchTerm(e.target.value)}
                className="w-full pl-9 pr-4 py-2 rounded-xl border border-stone-200 text-xs focus:border-amber-500 outline-none"
              />
            </div>

            <div className="flex items-center space-x-2 overflow-x-auto w-full sm:w-auto text-xs">
              {['All', 'Nouvelle demande', 'Confirmé', 'En préparation', 'Terminé'].map(st => (
                <button
                  key={st}
                  onClick={() => setFilterStatus(st)}
                  className={`px-3 py-1.5 rounded-xl whitespace-nowrap font-medium transition ${
                    filterStatus === st
                      ? 'bg-amber-600 text-white'
                      : 'bg-stone-100 text-stone-600 hover:bg-stone-200'
                  }`}
                >
                  {st === 'All' ? 'Toutes' : st}
                </button>
              ))}
            </div>
          </div>

          {/* Bookings Table */}
          <div className="overflow-x-auto">
            <table className="w-full text-left rtl:text-right text-xs">
              <thead className="bg-stone-100 text-stone-600 font-bold uppercase tracking-wider text-[10px]">
                <tr>
                  <th className="py-3 px-4 rounded-l-xl">Réf & Client</th>
                  <th className="py-3 px-4">Événement & Date</th>
                  <th className="py-3 px-4">Convives & Lieu</th>
                  <th className="py-3 px-4">Budget & Acompte</th>
                  <th className="py-3 px-4">Statut</th>
                  <th className="py-3 px-4 rounded-r-xl text-center">Actions</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-stone-100">
                {filtered.map(b => (
                  <tr key={b.id} className="hover:bg-amber-50/40 transition">
                    <td className="py-4 px-4">
                      <span className="font-bold text-charcoal block">{b.clientName}</span>
                      <span className="text-[10px] text-stone-400 font-mono">{b.phone}</span>
                    </td>
                    <td className="py-4 px-4">
                      <span className="font-semibold text-amber-800 block">{b.eventType}</span>
                      <span className="text-[10px] text-stone-500">{b.date} à {b.time}</span>
                    </td>
                    <td className="py-4 px-4">
                      <span className="font-bold text-stone-800 block">{b.guests} invités</span>
                      <span className="text-[10px] text-stone-500 truncate max-w-[150px] block">{b.location}</span>
                    </td>
                    <td className="py-4 px-4">
                      <span className="font-serif font-bold text-sm text-charcoal block">
                        {Number(b.estimatedBudget).toLocaleString()} TND
                      </span>
                      <span className="text-[10px] text-emerald-700 font-medium">
                        Acompte: {b.depositPaid || 0} TND
                      </span>
                    </td>
                    <td className="py-4 px-4">
                      <select
                        value={b.status}
                        onChange={(e) => handleStatusChange(b.id, e.target.value)}
                        className={`text-[11px] font-bold px-2 py-1 rounded-lg border outline-none ${
                          b.status === 'Confirmé' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' :
                          b.status === 'Nouvelle demande' ? 'bg-coral-50 text-coral-800 border-coral-300' :
                          b.status === 'En préparation' ? 'bg-amber-50 text-amber-800 border-amber-300' :
                          'bg-stone-100 text-stone-700 border-stone-300'
                        }`}
                      >
                        {['Nouvelle demande', 'En attente', 'Devis envoyé', 'Confirmé', 'En préparation', 'Terminé', 'Annulé'].map(s => (
                          <option key={s} value={s}>{s}</option>

                      </select>

      const [editingDish, setEditingDish] = useState(null);

      const toggleAvailability = (id) => {
        const updated = dishes.map(d => d.id === id ? { ...d, available: !d.available } : d);
        setDishes(updated);
        showToast('Disponibilité du plat mise à jour');
      };

      const handleDeleteDish = (id) => {
        if (confirm('Voulez-vous retirer ce plat de la carte ?')) {
          setDishes(dishes.filter(d => d.id !== id));
          showToast('Plat supprimé de la carte');
        }
      };

      return (
        <div className="bg-white rounded-2xl border border-stone-200 p-6 shadow-sm space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
              <h2 className="font-serif text-2xl font-bold text-charcoal">Administration de la Carte</h2>
              <p className="text-xs text-stone-500">Ajoutez, modifiez les prix et ajustez les disponibilités en temps réel</p>
            </div>
            <button
              onClick={() => setShowAddModal(true)}
              className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center space-x-2"
            >
              <i data-lucide="plus" className="w-4 h-4"></i>
              <span>Ajouter un Nouveau Plat</span>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            {dishes.map(dish => (
              <div key={dish.id} className="border border-stone-200 rounded-2xl overflow-hidden bg-stone-50/50 flex flex-col justify-between">
                <div>
                  <div className="relative h-40">
                    <img src={dish.image} alt={dish.name} className="w-full h-full object-cover" />
                    <span className="absolute top-3 left-3 bg-charcoal/80 text-white text-[10px] font-bold px-2 py-0.5 rounded-md">
                      {dish.category}
                    </span>
                    <button
                      onClick={() => toggleAvailability(dish.id)}
                      className={`absolute top-3 right-3 text-[10px] font-black px-2.5 py-1 rounded-full shadow ${
                        dish.available ? 'bg-emerald-500 text-white' : 'bg-stone-700 text-stone-300'
                      }`}
                    >
                      {dish.available ? 'Disponible' : 'Épuisé'}
                    </button>
                  </div>

                  <div className="p-4 space-y-2">
                    <div className="flex justify-between items-start">
                      <h4 className="font-serif font-bold text-base text-charcoal">{dish.name}</h4>
                      <span className="font-serif font-black text-amber-800 text-base">{dish.price} TND</span>
                    </div>
                    <p className="text-xs text-stone-500 line-clamp-2 leading-relaxed">{dish.desc}</p>
                  </div>
                </div>

                <div className="p-4 pt-0 flex justify-between items-center border-t border-stone-100 mt-2">
                  <button
                    onClick={() => setEditingDish(dish)}
                    className="text-xs text-amber-700 hover:text-amber-900 font-bold"
                  >
                    Modifier le plat
                  </button>
                  <button
                    onClick={() => handleDeleteDish(dish.id)}
                    className="text-stone-400 hover:text-coral-600"
                  >
                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>
            ))}
          </div>

          {/* ADD / EDIT DISH MODAL */}
          {(showAddModal || editingDish) && (
            <DishFormModal
              initialData={editingDish}
              onClose={() => {
                setShowAddModal(false);
                setEditingDish(null);
              }}
              onSave={(savedDish) => {
                if (editingDish) {
                  setDishes(dishes.map(d => d.id === savedDish.id ? savedDish : d));
                  showToast('Plat mis à jour');
                } else {
                  setDishes([savedDish, ...dishes]);
                  showToast('Nouveau plat ajouté au menu');
                }
                setShowAddModal(false);
                setEditingDish(null);
              }}
            />
          )}
        </div>
      );
    }

    // --- TAB: KITCHEN PREPARATION PLANNER ---
    function AdminKitchenTab({ tasks, setTasks, bookings, showToast }) {
      const [newTaskText, setNewTaskText] = useState('');
      const [newTaskStation, setNewTaskStation] = useState('Chaud & Tajines');

      const toggleTask = (id) => {
        const updated = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
        setTasks(updated);
      };

      const handleAddTask = (e) => {
        e.preventDefault();
        if (!newTaskText) return;
        const newTask = {
          id: `k${Date.now()}`,
          eventId: bookings[0]?.id || 'GENERAL',
          task: newTaskText,
          station: newTaskStation,
          done: false
        };
        setTasks([newTask, ...tasks]);
        setNewTaskText('');
        showToast('Tâche ajoutée au tableau de cuisine');
      };

      return (
        <div className="bg-white rounded-2xl border border-stone-200 p-6 shadow-sm space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
            <div>
              <h2 className="font-serif text-2xl font-bold text-charcoal">Planning & Préparations de Cuisine</h2>
              <p className="text-xs text-stone-500">Mise en place, approvisionnements du marché et découpe des viandes</p>
            </div>
            <div className="text-xs font-bold text-amber-800 bg-amber-50 border border-amber-200 px-3 py-1.5 rounded-xl">
              {tasks.filter(t => t.done).length} / {tasks.length} tâches terminées
            </div>
          </div>

          {/* Add Task Input */}
          <form onSubmit={handleAddTask} className="flex flex-col sm:flex-row gap-3 bg-stone-50 p-4 rounded-xl border border-stone-200">
            <input
              type="text"
              placeholder="Ex: Piler les épices pour le couscous de vendredi..."
              value={newTaskText}
              onChange={e => setNewTaskText(e.target.value)}
              className="flex-1 px-4 py-2.5 rounded-xl border border-stone-300 text-xs outline-none focus:border-amber-500"
            />
            <select
              value={newTaskStation}
              onChange={e => setNewTaskStation(e.target.value)}
              className="px-3 py-2 rounded-xl border border-stone-300 text-xs bg-white font-medium"
            >
              <option value="Chaud & Tajines">Chaud & Tajines</option>
              <option value="Froid & Salades">Froid & Salades</option>
              <option value="Boissons & Pâtisserie">Boissons & Pâtisserie</option>
              <option value="Achats & Marché">Achats & Marché</option>
              <option value="Matériel & Service">Matériel & Service</option>
            </select>
            <button
              type="submit"
              className="bg-amber-600 hover:bg-amber-700 text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shrink-0"
            >
              Ajouter
            </button>
          </form>

          {/* Tasks List */}
          <div className="space-y-2.5">
            {tasks.map(t => (
              <div
                key={t.id}
                onClick={() => toggleTask(t.id)}
                className={`p-3.5 rounded-xl border transition flex items-center justify-between cursor-pointer ${
                  t.done ? 'bg-stone-50 border-stone-200 text-stone-400 line-through' : 'bg-white border-stone-200 hover:border-amber-400 text-charcoal'
                }`}
              >
                <div className="flex items-center space-x-3 rtl:space-x-reverse">
                  <input
                    type="checkbox"
                    checked={t.done}
                    onChange={() => {}}
                    className="w-4 h-4 rounded text-amber-600 focus:ring-amber-400"
                  />
                  <span className="text-xs font-medium">{t.task}</span>
                </div>
                <span className="text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200 px-2 py-0.5 rounded-md">
                  {t.station}
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- TAB: QUOTES CALCULATOR & PAYMENTS ---
    function AdminQuotesTab({ packages, dishes, showToast }) {
      const [guestCount, setGuestCount] = useState(80);
      const [selectedPkgId, setSelectedPkgId] = useState(packages[0]?.id || 'p1');
      const [includeDrinks, setIncludeDrinks] = useState(true);
      const [includeDessertBar, setIncludeDessertBar] = useState(false);
      const [depositPercentage, setDepositPercentage] = useState(30);

      const chosenPkg = packages.find(p => p.id === selectedPkgId) || packages[0];
      const basePrice = (chosenPkg?.pricePerPerson || 60) * guestCount;
      const drinksPrice = includeDrinks ? (12 * guestCount) : 0;
      const dessertPrice = includeDessertBar ? (15 * guestCount) : 0;

      const totalTND = basePrice + drinksPrice + dessertPrice;
      const depositRequired = Math.round((totalTND * depositPercentage) / 100);
      const remainingBalance = totalTND - depositRequired;

      const handlePrint = () => {
        window.print();
      };

      return (
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
          {/* Controls */}
          <div className="lg:col-span-6 bg-white rounded-2xl border border-stone-200 p-6 shadow-sm space-y-6">
            <div>
              <h2 className="font-serif text-2xl font-bold text-charcoal">Simulateur & Devis Traiteur</h2>
              <p className="text-xs text-stone-500">Ajustez le nombre de convives et les options pour établir une cotation instantanée</p>
            </div>

            <div className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-stone-700 uppercase mb-2">Formule de Base</label>
                <select
                  value={selectedPkgId}
                  onChange={e => setSelectedPkgId(e.target.value)}
                  className="w-full px-4 py-2.5 rounded-xl border border-stone-300 font-semibold bg-white"
                >
                  {packages.map(p => (
                    <option key={p.id} value={p.id}>{p.name} — {p.pricePerPerson} TND / pers.</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block font-bold text-stone-700 uppercase mb-2">
                  Nombre de Convives : <span className="text-amber-700 font-bold">{guestCount} personnes</span>
                </label>
                <input
                  type="range"
                  min="20"
                  max="400"
                  step="5"
                  value={guestCount}
                  onChange={e => setGuestCount(Number(e.target.value))}
                  className="w-full accent-amber-600"
                />
              </div>

              <div className="space-y-2 pt-2">
                <label className="flex items-center space-x-2.5 rtl:space-x-reverse cursor-pointer">
                  <input
                    type="checkbox"
                    checked={includeDrinks}
                    onChange={e => setIncludeDrinks(e.target.checked)}
                    className="w-4 h-4 rounded text-amber-600"
                  />
                  <span>Option Bar à Thés aux pignons & Citronnades artisanales (+12 TND/pers.)</span>
                </label>
                <label className="flex items-center space-x-2.5 rtl:space-x-reverse cursor-pointer">
                  <input
                    type="checkbox"
                    checked={includeDessertBar}
                    onChange={e => setIncludeDessertBar(e.target.checked)}
                    className="w-4 h-4 rounded text-amber-600"
                  />
                  <span>Option Fontaine de fruits sculptés & Assida Zgougou (+15 TND/pers.)</span>
                </label>
              </div>

              <div className="pt-2">
                <label className="block font-bold text-stone-700 uppercase mb-2">Pourcentage d’Acompte Exigé : {depositPercentage}%</label>
                <input
                  type="range"
                  min="20"
                  max="50"
                  step="5"
                  value={depositPercentage}
                  onChange={e => setDepositPercentage(Number(e.target.value))}
                  className="w-full accent-amber-600"
                />
              </div>
            </div>
          </div>

          {/* Printable Quote Sheet Preview */}
          <div className="lg:col-span-6 bg-amber-50/40 rounded-2xl border-2 border-dashed border-amber-300 p-6 shadow-sm flex flex-col justify-between">
            <div className="space-y-4">
              <div className="flex justify-between items-center border-b border-amber-200 pb-3">
                <div>
                  <h3 className="font-serif font-black text-xl text-charcoal">DEVIS ESTIMATIF</h3>
                  <p className="text-[11px] text-stone-500">Dar El Bey Traiteur • Chef Karim Ben Amor</p>
                </div>
                <span className="text-xs font-mono font-bold bg-amber-200/80 px-2.5 py-1 rounded">
                  #DEV-2025-{Math.floor(1000 + guestCount)}
                </span>
              </div>

              <div className="space-y-2 text-xs">
                <div className="flex justify-between py-1">
                  <span>{chosenPkg.name} ({guestCount} x {chosenPkg.pricePerPerson} TND)</span>
                  <span className="font-bold">{basePrice.toLocaleString()} TND</span>
                </div>
                {includeDrinks && (
                  <div className="flex justify-between py-1 text-stone-600">
                    <span>Forfait Boissons & Thés royaux</span>
                    <span className="font-bold">{drinksPrice.toLocaleString()} TND</span>
                  </div>
                )}
                {includeDessertBar && (
                  <div className="flex justify-between py-1 text-stone-600">
                    <span>Cascade de Fruits & Assida Zgougou</span>
                    <span className="font-bold">{dessertPrice.toLocaleString()} TND</span>
                  </div>
                )}
              </div>

              <div className="border-t border-amber-200 pt-3 space-y-1.5 text-xs">
                <div className="flex justify-between text-base font-serif font-black text-amber-900">
                  <span>Total Net Estimé :</span>
                  <span>{totalTND.toLocaleString()} TND</span>
                </div>
                <div className="flex justify-between text-emerald-800 font-bold">
                  <span>Acompte à la signature ({depositPercentage}%) :</span>
                  <span>{depositRequired.toLocaleString()} TND</span>
                </div>
                <div className="flex justify-between text-stone-500 text-[11px]">
                  <span>Solde le jour de l’événement :</span>
                  <span>{remainingBalance.toLocaleString()} TND</span>
                </div>
              </div>
            </div>

            <div className="pt-6 mt-6 border-t border-amber-200 flex gap-3">
              <button
                onClick={handlePrint}
                className="flex-1 bg-charcoal hover:bg-stone-800 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center space-x-2"
              >
                <i data-lucide="printer" className="w-4 h-4"></i>
                <span>Imprimer / Exporter PDF</span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MODAL: NEW / EDIT DISH ---
    function DishFormModal({ initialData, onClose, onSave }) {
      const [name, setName] = useState(initialData?.name || '');
      const [category, setCategory] = useState(initialData?.category || 'Starters');
      const [price, setPrice] = useState(initialData?.price || 20);
      const [desc, setDesc] = useState(initialData?.desc || '');
      const [image, setImage] = useState(initialData?.image || 'https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=600&q=80');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSave({
          id: initialData?.id || `d${Date.now()}`,
          name,
          category,
          price: Number(price),
          desc,
          available: initialData?.available ?? true,
          image
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-charcoal/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-amber-300 space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="font-serif font-bold text-xl text-charcoal">
                {initialData ? 'Modifier le Plat' : 'Ajouter un Plat au Menu'}
              </h3>
              <button onClick={onClose}><i data-lucide="x" className="w-5 h-5 text-stone-400"></i></button>
            </div>

            <form onSubmit={handleSubmit} className="space-y-3 text-xs">
              <div>
                <label className="block font-bold mb-1">Nom du Plat *</label>
                <input
                  type="text"
                  required
                  value={name}
                  onChange={e => setName(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold mb-1">Catégorie</label>
                  <select
                    value={category}
                    onChange={e => setCategory(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white"
                  >
                    <option value="Starters">Entrées & Salades</option>
                    <option value="Tajines">Tajines</option>
                    <option value="Mains">Plats Principaux</option>
                    <option value="Desserts">Desserts & Pâtisseries</option>
                    <option value="Drinks">Boissons</option>
                  </select>
                </div>
                <div>
                  <label className="block font-bold mb-1">Prix Indicatif (TND)</label>
                  <input
                    type="number"
                    required
                    value={price}
                    onChange={e => setPrice(e.target.value)}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300"
                  />
                </div>
              </div>

              <div>
                <label className="block font-bold mb-1">URL Photo Illustration</label>
                <input
                  type="url"
                  value={image}
                  onChange={e => setImage(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300"
                />
              </div>

              <div>
                <label className="block font-bold mb-1">Description & Ingrédients Nobles</label>
                <textarea
                  rows="2"
                  value={desc}
                  onChange={e => setDesc(e.target.value)}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300"
                ></textarea>
              </div>

              <div className="pt-2">
                <button type="submit" className="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow">
                  Enregistrer
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- MODAL: NEW BOOKING MANUAL ---
    function NewBookingModal({ onClose, onSave }) {
      const [form, setForm] = useState({
        clientName: '',
        phone: '',
        eventType: 'Mariage',
        date: '2025-05-15',
        time: '19:00',
        location: 'La Marsa',
        guests: 70,
        estimatedBudget: 5500,
        notes: ''
      });

      return (
        <div className="fixed inset-0 z-50 bg-charcoal/60 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-amber-300 space-y-4">
            <div className="flex justify-between items-center">
              <h3 className="font-serif font-bold text-xl text-charcoal">Ajouter un Événement au Planning</h3>
              <button onClick={onClose}><i data-lucide="x" className="w-5 h-5 text-stone-400"></i></button>
            </div>

            <form
              onSubmit={(e) => {
                e.preventDefault();
                onSave({
                  id: `BKG-${Math.floor(100 + Math.random() * 900)}`,
                  ...form,
                  status: 'Confirmé',
                  depositPaid: Math.round(form.estimatedBudget * 0.3),
                  createdAt: new Date().toISOString().split('T')[0]
                });
              }}
              className="space-y-3 text-xs"
            >
              <div>
                <label className="block font-bold mb-1">Nom du Client *</label>
                <input
                  required
                  value={form.clientName}
                  onChange={e => setForm({ ...form, clientName: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold mb-1">Téléphone</label>
                  <input
                    value={form.phone}
                    onChange={e => setForm({ ...form, phone: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300"
                  />
                </div>
                <div>
                  <label className="block font-bold mb-1">Type d’Événement</label>
                  <select
                    value={form.eventType}
                    onChange={e => setForm({ ...form, eventType: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300 bg-white"
                  >
                    <option value="Mariage">Mariage</option>
                    <option value="Fiançailles">Fiançailles</option>
                    <option value="Anniversaire">Anniversaire</option>
                    <option value="Dîner Privé">Dîner Privé</option>
                  </select>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold mb-1">Date *</label>
                  <input
                    type="date"
                    required
                    value={form.date}
                    onChange={e => setForm({ ...form, date: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300"
                  />
                </div>
                <div>
                  <label className="block font-bold mb-1">Heure</label>
                  <input
                    type="time"
                    value={form.time}
                    onChange={e => setForm({ ...form, time: e.target.value })}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-bold mb-1">Nombre d’Invités</label>
                  <input
                    type="number"
                    value={form.guests}
                    onChange={e => setForm({ ...form, guests: Number(e.target.value) })}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300"
                  />
                </div>
                <div>
                  <label className="block font-bold mb-1">Budget Total (TND)</label>
                  <input
                    type="number"
                    value={form.estimatedBudget}
                    onChange={e => setForm({ ...form, estimatedBudget: Number(e.target.value) })}
                    className="w-full px-3 py-2 rounded-xl border border-stone-300"
                  />
                </div>
              </div>

              <div>
                <label className="block font-bold mb-1">Lieu</label>
                <input
                  value={form.location}
                  onChange={e => setForm({ ...form, location: e.target.value })}
                  className="w-full px-3 py-2 rounded-xl border border-stone-300"
                />
              </div>

              <div className="pt-2">
                <button type="submit" className="w-full bg-amber-600 text-white font-bold py-2.5 rounded-xl shadow">
                  Créer l’Événement
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- RENDER REACT ROOT ---
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
